image: gitlab-registry.cern.ch/ci-tools/ci-worker:cc7

stages:
  - flake8
  - test
before_script:
  - yum install -y python3 python3-pip python3-devel > /dev/null
  - pip3 install pep8-naming > /dev/null
  - echo flake8 version `flake8 --version`

flake8:
  stage: flake8
  script:
    - flake8 --extend-ignore N806

test:
  stage: test
  tags:
    - cvmfs
  script:
    - source example/environment.sh
    - python3 -m pip install --upgrade --upgrade-strategy eager --editable .
    - cd example
    - python3 -m pepper.runproc example_processor.py test_config.json
  artifacts:
    expire_in: 10 hours
    paths:
     - example/cutflows.json


