[metadata]
name = pepper
version = 2.0
description = ParticlE Physics ProcEssoR

[options]
packages = find:
install_requires =
    coffea >= 2026.5.0
    awkward >= 2.8.2
    uproot >= 5.7.3
    dask_jobqueue >= 0.8.3
    distributed >= 2024.7.0
    bokeh !=3.0.*,>=2.4.2
    scipy
    h5py
    hdf5plugin
    hist
    hjson
    correctionlib
    numba !=0.62,!=0.63
    numcodecs
# Numba restriction due to this bug: https://github.com/numba/numba/issues/10239#event-3583569837 - currently affects 0.62 and 0.63

[options.extras_require]
dev =
    pep8-naming
docs =
    sphinx
    sphinx-autodoc-typehints<2.0
    sphinx-rtd-theme
    sphinx_design
    sphinx-copybutton
    pydata-sphinx-theme
    sphinxcontrib-mermaid

	
[flake8]
extend-ignore = N806
max-line-length = 120
exclude = 
    docs

[mypy]
ignore_missing_imports = True
